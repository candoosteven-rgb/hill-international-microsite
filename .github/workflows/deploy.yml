name: Deploy to Cloudflare

on:
  push:
    branches:
      - claude/new-session-ofu25o
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Check MAPBOX_TOKEN secret is set (does not print the value)
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "$NEXT_PUBLIC_MAPBOX_TOKEN" ]; then
            echo "::warning::MAPBOX_TOKEN secret is EMPTY or not set"
          else
            echo "MAPBOX_TOKEN secret is set (length: ${#NEXT_PUBLIC_MAPBOX_TOKEN}, starts with: ${NEXT_PUBLIC_MAPBOX_TOKEN:0:3})"
          fi

      - name: Build
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          # Turbopack has a known, non-deterministic font-loading flake -
          # "Module not found: Can't resolve
          # '@vercel/turbopack-next/internal/font/google/font'" - that has
          # nothing to do with the actual source change in a given commit
          # (hit repeatedly in local development, and once here in CI on an
          # otherwise-unrelated content change). A clean retry has always
          # succeeded, so retry once before failing the whole deploy over it.
          npm run build && exit 0
          echo "::warning::First build attempt failed - retrying once in case this was the known Turbopack font-loading flake."
          rm -rf .next out
          npm run build

      - name: Verify MAPBOX_TOKEN was actually inlined into the build output
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "$NEXT_PUBLIC_MAPBOX_TOKEN" ]; then
            echo "::error::MAPBOX_TOKEN secret is empty - the live map would show 'Map unavailable'"
            exit 1
          fi
          if ! grep -rqF "$NEXT_PUBLIC_MAPBOX_TOKEN" out/_next/static/chunks/*.js; then
            echo "::error::NEXT_PUBLIC_MAPBOX_TOKEN wasn't inlined into any client chunk, even though the secret is set - the build succeeded but the live map would silently show 'Map unavailable' with no map errors visible anywhere."
            exit 1
          fi
          # The check above only proves the literal exists SOMEWHERE in the
          # build - it has passed before while the specific chunk that reads
          # it still carried the unsubstituted runtime lookup (Turbopack can
          # inline the same module differently across chunks it ends up
          # split into). Directly fail on that exact broken pattern too.
          if grep -rlE '\.env\.NEXT_PUBLIC_MAPBOX_TOKEN\b' out/_next/static/chunks/*.js; then
            echo "::error::Found an un-inlined runtime read of NEXT_PUBLIC_MAPBOX_TOKEN (e.g. 'process.env.NEXT_PUBLIC_MAPBOX_TOKEN') in a client chunk above - that chunk will see an empty token in the browser and show 'Map unavailable', even though another chunk did get the literal inlined."
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFARE_API_TOKEN }}
          wranglerVersion: "4"
