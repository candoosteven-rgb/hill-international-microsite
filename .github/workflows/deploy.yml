name: Deploy to Cloudflare

on:
  push:
    branches:
      - claude/new-session-ofu25o
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Check MAPBOX_TOKEN secret is set (does not print the value)
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "$NEXT_PUBLIC_MAPBOX_TOKEN" ]; then
            echo "::warning::MAPBOX_TOKEN secret is EMPTY or not set"
          else
            echo "MAPBOX_TOKEN secret is set (length: ${#NEXT_PUBLIC_MAPBOX_TOKEN}, starts with: ${NEXT_PUBLIC_MAPBOX_TOKEN:0:3})"
          fi

      - run: npm run build
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      - name: Verify MAPBOX_TOKEN was actually inlined into the build output
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "$NEXT_PUBLIC_MAPBOX_TOKEN" ]; then
            echo "::error::MAPBOX_TOKEN secret is empty - the live map would show 'Map unavailable'"
            exit 1
          fi
          if ! grep -rqF "$NEXT_PUBLIC_MAPBOX_TOKEN" out/_next/static/chunks/*.js; then
            echo "::error::NEXT_PUBLIC_MAPBOX_TOKEN wasn't inlined into any client chunk, even though the secret is set - the build succeeded but the live map would silently show 'Map unavailable' with no map errors visible anywhere. This has happened before from a Next.js/Turbopack + Node version combination that fails to inline NEXT_PUBLIC_ vars (it compiles to a runtime process.env property read instead of a literal) - check the Node version this workflow uses against one known to inline correctly."
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFARE_API_TOKEN }}
          wranglerVersion: "4"
